name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Pin Python 3.12
        run: uv python install 3.12

      - name: Create the environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch
          uv pip install numpy scipy pandas scikit-learn pyyaml matplotlib pytest ruff
          uv pip install -e . --no-deps

      - name: Lint
        run: uv run --no-project ruff check src scripts tests

      - name: Fast tests
        run: uv run --no-project python -m pytest tests -q -m "not slow"

      # The slow tests train real (tiny) models end to end, so they are the
      # ones that catch wiring bugs between modules. They are the reason a
      # `-m "not slow"` run is not evidence that the suite passes.
      # Linux only, to keep the matrix cheap.
      - name: Slow tests (end to end)
        if: matrix.os == 'ubuntu-latest'
        run: uv run --no-project python -m pytest tests -q -m slow

      - name: End-to-end smoke run
        run: uv run --no-project python scripts/train.py --config configs/smoke.yaml --no-analysis

      - name: Documentation tables match their CSVs
        # results/tables/ is committed, so a doc table that drifted from its
        # artefact fails here rather than shipping.
        run: uv run --no-project python scripts/render_docs.py --check

# Shared defaults. Every other config inherits from this via `_base_`.
# The scale is set by a hard constraint: 4 CPU cores, no GPU, and a 20-minute
# ceiling on any single training run. 48 frames and a 24/48/64/96 channel budget
# are what fits; the Colab notebook runs the identical code at full scale.
data:
  num_sequences: 1400
  num_frames: 48
  num_subjects: 24
  max_degradations: 3
  severity_min: 0.15
  severity_max: 1.0
  noise_std: 0.006
  jitter_std: 0.004
  dropout_prob: 0.05
  clean_fraction: 0.04
  split: subject          # cross-subject by default; `random` leaks and is reported
  val_fraction: 0.15
  test_fraction: 0.25
  batch_size: 32

model:
  architecture: saqa_stgcn
  head: ordinal
  uncertainty: quantile
  num_bins: 10
  temporal_kernel: 9
  partitions: spatial     # identity / centripetal / centrifugal
  separable: true
  edge_importance: true
  dropout: 0.05
  norm: batch             # NOT group: see saqa.models.stgcn.make_norm
  uncertainty_weight: 0.5

optim:
  epochs: 20
  lr: 0.003
  weight_decay: 0.0001
  grad_clip: 5.0
  warmup_epochs: 2
  min_lr_factor: 0.05

eval:
  bootstrap: 2000
  interval_level: 0.9
  attribution_methods: [integrated_gradients, occlusion, gradient]
  ig_steps: 24
  monotonicity_ladders: 60
  top_k_joints: 3

run:
  name: saqa
  seed: 0
  out_dir: results/runs
  torch_threads: 2

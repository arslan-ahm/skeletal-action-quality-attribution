[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saqa"
version = "1.0.0"
description = "Reference-free calibrated skeletal action-quality regression with validated per-joint, per-phase attribution"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Habiba Sajid" }]
keywords = [
    "action-quality-assessment",
    "skeleton",
    "graph-convolution",
    "st-gcn",
    "attribution",
    "explainability",
    "ordinal-regression",
    "quantile-regression",
    "uncertainty-quantification",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
notebooks = ["jupyter>=1.0", "nbformat>=5.9", "nbconvert>=7.10"]

[project.scripts]
saqa = "saqa.cli:main"

[project.urls]
Homepage = "https://github.com/HabibaSajid321/skeletal-action-quality-attribution"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: marks tests that take more than a few seconds"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E741"]

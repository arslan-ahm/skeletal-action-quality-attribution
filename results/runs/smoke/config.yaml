data:
  num_sequences: 240
  num_frames: 32
  num_subjects: 8
  max_degradations: 3
  severity_min: 0.15
  severity_max: 1.0
  noise_std: 0.006
  jitter_std: 0.004
  dropout_prob: 0.05
  dropout_max_frames: 5
  clean_fraction: 0.04
  split: subject
  val_fraction: 0.15
  test_fraction: 0.25
  batch_size: 16
  train_limit: 0
model:
  architecture: saqa_stgcn
  head: ordinal
  uncertainty: quantile
  num_bins: 10
  temporal_kernel: 9
  partitions: spatial
  separable: true
  edge_importance: true
  dropout: 0.05
  norm: batch
  uncertainty_weight: 0.5
  channels:
  - 12
  - 24
  - 32
  strides:
  - 2
  - 2
  - 1
optim:
  epochs: 3
  lr: 0.003
  weight_decay: 0.0001
  grad_clip: 5.0
  warmup_epochs: 2
  min_lr_factor: 0.05
eval:
  bootstrap: 200
  interval_level: 0.9
  attribution_methods:
  - integrated_gradients
  - occlusion
  - gradient
  ig_steps: 8
  monotonicity_ladders: 6
  top_k_joints: 3
run:
  name: smoke
  seed: 0
  out_dir: results/runs
  torch_threads: 2
  save_checkpoint: false

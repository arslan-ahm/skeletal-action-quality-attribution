data:
  num_sequences: 1000
  num_frames: 48
  num_subjects: 24
  max_degradations: 3
  severity_min: 0.15
  severity_max: 1.0
  noise_std: 0.006
  jitter_std: 0.004
  dropout_prob: 0.05
  dropout_max_frames: 5
  clean_fraction: 0.04
  split: subject
  val_fraction: 0.15
  test_fraction: 0.25
  batch_size: 32
  train_limit: 0
model:
  architecture: saqa_stgcn
  head: regression
  uncertainty: quantile
  num_bins: 10
  temporal_kernel: 9
  partitions: spatial
  separable: true
  edge_importance: true
  dropout: 0.05
  norm: batch
  uncertainty_weight: 0.5
  channels: []
  strides: []
optim:
  epochs: 8
  lr: 0.003
  weight_decay: 0.0001
  grad_clip: 5.0
  warmup_epochs: 2
  min_lr_factor: 0.05
eval:
  bootstrap: 2000
  interval_level: 0.9
  attribution_methods:
  - integrated_gradients
  - occlusion
  - gradient
  ig_steps: 24
  attribution_limit: 150
  monotonicity_ladders: 60
  top_k_joints: 3
run:
  name: saqa
  seed: 0
  out_dir: results/runs
  torch_threads: 2
  save_checkpoint: false
